<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1210" viewBox="0 0 1750 1210" role="img" aria-labelledby="title desc">
  <title id="title">Event Registration System - Class Diagram</title>
  <desc id="desc">UML-style class diagram matching the supplied Mermaid classDiagram, with every class split into attributes and methods compartments.</desc>
  <defs>
    <style>
      .text { font-family: "Segoe UI", Arial, sans-serif; fill: #111827; }
      .title { font-size: 32px; font-weight: 700; }
      .class-name { fill: #ffffff; font-size: 18px; font-weight: 700; }
      .stereo { fill: #e0f2fe; font-size: 14px; font-weight: 650; }
      .member { font-size: 14px; }
      .compact { font-size: 13px; }
      .label { font-size: 13px; }
      .mult { fill: #7c2d12; font-size: 15px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.6; rx: 7; }
      .entity { fill: #1e4f7a; }
      .service { fill: #0f766e; }
      .value { fill: #7c2d12; }
      .repo { fill: #6d28d9; }
      .divider { stroke: #cbd5e1; stroke-width: 1.2; }
      .compartment { stroke: #94a3b8; stroke-width: 1.4; }
      .assoc { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dep { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-soft); }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; rx: 7; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
    <marker id="arrow-soft" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="875" y="42" text-anchor="middle" class="text title">Event Registration System - Class Diagram</text>

  <g id="AdminUser">
    <rect x="40" y="80" width="310" height="300" class="box" />
    <rect x="40" y="80" width="310" height="52" class="entity" />
    <text x="195" y="101" text-anchor="middle" class="text stereo">&lt;&lt;entity&gt;&gt;</text>
    <text x="195" y="125" text-anchor="middle" class="text class-name">AdminUser</text>
    <line x1="40" y1="132" x2="350" y2="132" class="divider" />
    <line x1="40" y1="256" x2="350" y2="256" class="compartment" />
    <text x="60" y="160" class="text member">+uuid id</text>
    <text x="60" y="181" class="text member">+text email</text>
    <text x="60" y="202" class="text member">+text passwordHash</text>
    <text x="60" y="223" class="text member">+text role</text>
    <text x="60" y="244" class="text member">+boolean isActive</text>
  </g>

  <g id="RegistrationService">
    <rect x="40" y="760" width="330" height="220" class="box" />
    <rect x="40" y="760" width="330" height="45" class="service" />
    <text x="205" y="789" text-anchor="middle" class="text class-name">RegistrationService</text>
    <line x1="40" y1="805" x2="370" y2="805" class="divider" />
    <line x1="40" y1="893" x2="370" y2="893" class="compartment" />
    <text x="60" y="930" class="text member">+createRegistration(input)</text>
    <text x="60" y="953" class="text member">uses settings, state, request repos</text>
    <text x="60" y="976" class="text member">uses normalization utilities</text>
  </g>

  <g id="RegistrationRequest">
    <rect x="430" y="80" width="380" height="430" class="box" />
    <rect x="430" y="80" width="380" height="52" class="entity" />
    <text x="620" y="101" text-anchor="middle" class="text stereo">&lt;&lt;entity&gt;&gt;</text>
    <text x="620" y="125" text-anchor="middle" class="text class-name">RegistrationRequest</text>
    <line x1="430" y1="132" x2="810" y2="132" class="divider" />
    <line x1="430" y1="321" x2="810" y2="321" class="compartment" />
    <text x="450" y="160" class="text member">+uuid id</text>
    <text x="450" y="177" class="text member">+text requestNumber</text>
    <text x="450" y="194" class="text member">+text fullName</text>
    <text x="450" y="211" class="text member">+integer age</text>
    <text x="450" y="228" class="text member">+text major</text>
    <text x="450" y="245" class="text member">+text phone</text>
    <text x="450" y="262" class="text member">+text normalizedPhone</text>
    <text x="450" y="279" class="text member">+text email</text>
    <text x="450" y="296" class="text member">+text normalizedEmail</text>
    <text x="450" y="313" class="text member">+text city</text>
  </g>

  <g id="RequestService">
    <rect x="430" y="760" width="340" height="220" class="box" />
    <rect x="430" y="760" width="340" height="45" class="service" />
    <text x="600" y="789" text-anchor="middle" class="text class-name">RequestService</text>
    <line x1="430" y1="805" x2="770" y2="805" class="divider" />
    <line x1="430" y1="893" x2="770" y2="893" class="compartment" />
    <text x="450" y="930" class="text member">+getRequests(filters)</text>
    <text x="450" y="953" class="text member">+updateRequestState()</text>
    <text x="450" y="976" class="text member">+createNote() / archiveRequest()</text>
  </g>

  <g id="RequestNote">
    <rect x="890" y="80" width="310" height="300" class="box" />
    <rect x="890" y="80" width="310" height="52" class="entity" />
    <text x="1045" y="101" text-anchor="middle" class="text stereo">&lt;&lt;entity&gt;&gt;</text>
    <text x="1045" y="125" text-anchor="middle" class="text class-name">RequestNote</text>
    <line x1="890" y1="132" x2="1200" y2="132" class="divider" />
    <line x1="890" y1="256" x2="1200" y2="256" class="compartment" />
    <text x="910" y="160" class="text member">+uuid id</text>
    <text x="910" y="181" class="text member">+uuid requestId</text>
    <text x="910" y="202" class="text member">+uuid adminId</text>
    <text x="910" y="223" class="text member">+text body</text>
    <text x="910" y="244" class="text member">+timestamptz createdAt</text>
  </g>

  <g id="RequestActionLog">
    <rect x="890" y="430" width="355" height="330" class="box" />
    <rect x="890" y="430" width="355" height="52" class="entity" />
    <text x="1068" y="451" text-anchor="middle" class="text stereo">&lt;&lt;entity&gt;&gt;</text>
    <text x="1068" y="475" text-anchor="middle" class="text class-name">RequestActionLog</text>
    <line x1="890" y1="482" x2="1245" y2="482" class="divider" />
    <line x1="890" y1="621" x2="1245" y2="621" class="compartment" />
    <text x="910" y="510" class="text compact">+uuid id</text>
    <text x="910" y="529" class="text compact">+uuid? requestId</text>
    <text x="910" y="548" class="text compact">+uuid? actorAdminId</text>
    <text x="910" y="567" class="text compact">+system|visitor|admin actorType</text>
    <text x="910" y="586" class="text compact">+text action</text>
    <text x="910" y="605" class="text compact">+json metadata</text>
  </g>

  <g id="AuthService">
    <rect x="890" y="820" width="315" height="220" class="box" />
    <rect x="890" y="820" width="315" height="45" class="service" />
    <text x="1048" y="849" text-anchor="middle" class="text class-name">AuthService</text>
    <line x1="890" y1="865" x2="1205" y2="865" class="divider" />
    <line x1="890" y1="953" x2="1205" y2="953" class="compartment" />
    <text x="910" y="990" class="text member">+login(input)</text>
    <text x="910" y="1013" class="text member">uses bcrypt password check</text>
    <text x="910" y="1036" class="text member">issues JWT access token</text>
  </g>

  <g id="RequestState">
    <rect x="1330" y="80" width="320" height="320" class="box" />
    <rect x="1330" y="80" width="320" height="52" class="entity" />
    <text x="1490" y="101" text-anchor="middle" class="text stereo">&lt;&lt;entity&gt;&gt;</text>
    <text x="1490" y="125" text-anchor="middle" class="text class-name">RequestState</text>
    <line x1="1330" y1="132" x2="1650" y2="132" class="divider" />
    <line x1="1330" y1="266" x2="1650" y2="266" class="compartment" />
    <text x="1350" y="160" class="text member">+uuid id</text>
    <text x="1350" y="179" class="text member">+text name</text>
    <text x="1350" y="198" class="text member">+text slug</text>
    <text x="1350" y="217" class="text member">+text color</text>
    <text x="1350" y="236" class="text member">+integer sortOrder</text>
    <text x="1350" y="255" class="text member">+boolean isSystem</text>
  </g>

  <g id="AppSetting">
    <rect x="1330" y="450" width="320" height="240" class="box" />
    <rect x="1330" y="450" width="320" height="52" class="value" />
    <text x="1490" y="471" text-anchor="middle" class="text stereo">&lt;&lt;value object&gt;&gt;</text>
    <text x="1490" y="495" text-anchor="middle" class="text class-name">AppSetting</text>
    <line x1="1330" y1="502" x2="1650" y2="502" class="divider" />
    <line x1="1330" y1="596" x2="1650" y2="596" class="compartment" />
    <text x="1350" y="530" class="text member">+text key</text>
    <text x="1350" y="552" class="text member">+json value</text>
    <text x="1350" y="574" class="text member">+timestamptz updatedAt</text>
  </g>

  <g id="Repositories">
    <rect x="1330" y="820" width="320" height="300" class="box" />
    <rect x="1330" y="820" width="320" height="45" class="repo" />
    <text x="1490" y="849" text-anchor="middle" class="text class-name">Repositories</text>
    <line x1="1330" y1="865" x2="1650" y2="865" class="divider" />
    <line x1="1330" y1="993" x2="1650" y2="993" class="compartment" />
    <text x="1350" y="895" class="text member">+AdminRepository</text>
    <text x="1350" y="918" class="text member">+RequestRepository</text>
    <text x="1350" y="941" class="text member">+StateRepository</text>
    <text x="1350" y="964" class="text member">+SettingsRepository</text>
    <text x="1350" y="987" class="text member">+ActionLogRepository</text>
  </g>

  <!-- Associations from the supplied Mermaid diagram -->
  <path d="M810 210 C1000 188 1155 178 1330 205" class="assoc" />
  <text x="830" y="196" class="text mult">*</text>
  <text x="1300" y="194" class="text mult">1</text>
  <text x="1075" y="170" text-anchor="middle" class="text label">current state</text>

  <path d="M810 188 L890 188" class="assoc" />
  <text x="825" y="175" class="text mult">1</text>
  <text x="866" y="175" class="text mult">*</text>

  <path d="M350 188 L890 188" class="assoc" />
  <text x="370" y="175" class="text mult">1</text>
  <text x="866" y="175" class="text mult">*</text>

  <path d="M810 458 C840 498 858 538 890 575" class="assoc" />
  <text x="820" y="477" class="text mult">0..1</text>
  <text x="866" y="566" class="text mult">*</text>

  <path d="M350 285 C540 405 700 520 890 586" class="assoc" />
  <text x="370" y="309" class="text mult">0..1</text>
  <text x="866" y="577" class="text mult">*</text>
  <text x="635" y="460" text-anchor="middle" class="text label">logged admin actor</text>

  <path d="M370 930 C450 785 500 640 560 510" class="dep" />
  <text x="480" y="696" class="text label">creates</text>

  <path d="M370 952 C535 790 700 680 890 610" class="dep" />
  <text x="612" y="776" class="text label">creates</text>

  <path d="M640 893 C730 650 820 390 890 244" class="dep" />
  <text x="770" y="565" class="text label">manages</text>

  <path d="M770 940 C820 825 852 700 890 620" class="dep" />
  <text x="836" y="780" class="text label">manages</text>

  <path d="M1048 953 L1064 760" class="dep" />
  <text x="1072" y="850" class="text label">authenticates</text>

  <path d="M370 930 L430 930" class="assoc" />
  <path d="M770 930 L890 930" class="assoc" />
  <path d="M1205 930 L1330 930" class="assoc" />

  <rect x="160" y="1150" width="1430" height="42" class="note" />
  <text x="875" y="1177" text-anchor="middle" class="text label">The implementation uses TypeScript row types, repositories, and services instead of concrete ORM entity classes; this diagram expresses the equivalent domain class model.</text>
</svg>
